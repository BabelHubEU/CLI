# BabelHub w GitLab CI — **fragment do wklejenia do `.gitlab-ci.yml` aplikacji**.
#
# To odpowiednik `examples/ci/github-actions.yml` dla GitLaba: te same polecenia, ten sam
# kontrakt kodów wyjścia, ta sama zmienna z poświadczeniem. Różni się tylko to, co w GitLabie
# musi być inne: `rules` zamiast `if`, `allow_failure` zamiast `continue-on-error` i push przez
# token projektu (w GitLabie `CI_JOB_TOKEN` **nie** może wypychać commitów do repozytorium).
#
# **Cztery kontrole to cztery joby**, a nie jedna lista poleceń. W GitLabie merge request pokazuje
# nazwy jobów, więc `babelhub:coverage` na czerwono mówi wprost, co blokuje merge — bez otwierania
# logu. Jedna lista poleceń dałaby to samo dopiero po przeczytaniu logu, czyli po to, po co się
# tam nie wchodzi. Cena jest jawna: `before_script` (instalacja CLI) powtarza się w każdym jobie.
#
# Wklej całość do swojego `.gitlab-ci.yml`. Jeśli masz już sekcję `stages`, dopisz do niej
# `i18n` (albo podmień `stage:` w jobach na własną nazwę) i popraw miejsca oznaczone `ZMIEŃ`.
# Instrukcja: `docs/ci.md` w repozytorium BabelHub.

stages:
  - test
  - i18n

# Wspólna część jobów. Obraz `composer:2` ma PHP 8.3 i Composera, czyli dokładnie to,
# czego potrzebuje CLI — bez budowania własnego obrazu.
.babelhub:
  image: composer:2
  variables:
    # ZMIEŃ 1/2: adres twojej instancji BabelHub.
    #
    # **Tylko wartość, bez `description`.** GitLab nie przyjmuje `description` (ani `options`)
    # w `variables` na poziomie joba — schema zna tam wyłącznie `value` i `expand`. Deklaracja
    # z `description` kończy się błędem `config uses invalid data keys: description` i **pipeline
    # nie powstaje wcale**, więc nie działa też to, co z BabelHub nie ma nic wspólnego (`sast`,
    # `secret_detection`). `description` wolno użyć tylko w sekcji `variables` najwyższego
    # poziomu — ale wariant „opis bez wartości” robi ze zmiennej warunek **całego** pipeline'u,
    # dlatego zamiast tego joby mają strażnika, który mówi wprost, czego brakuje.
    BABELHUB_API_URL: https://babelhub.example
    # ZMIEŃ 2/2: `BABELHUB_TOKEN` ustaw w Settings → CI/CD → Variables — **maskowany, ale NIE
    # „protected”**. Chronione zmienne są niedostępne dla pipeline'ów merge requestów z gałęzi,
    # które nie są chronione (od GitLaba 18.1 dostęp mają tylko wtedy, gdy i źródłowa, i docelowa
    # gałąź są chronione), więc bramka na MR nie zobaczyłaby tokenu — a to jest cały sens tego
    # fragmentu. Sekretu nie ma w repozytorium i nigdy nie może tu trafić.
  before_script:
    # Pakiet jest w Packagu. Constraint `~0.1.3`, a **nie** `^0.1`: Composer zawęża caret na
    # wersji `0.x` do dokładnej i `^0.1` zainstalowałby `0.1.0` (wydanie z defektem limitu hook-a,
    # bez `files.root_key` — czyli bez obsługi koperty katalogu).
    - composer global require babelhub/cli:~0.1.3 --no-interaction
    - export PATH="$PATH:$(composer global config bin-dir --absolute)"

# Reguła dla wszystkich czterech kontroli: merge request. `rules` zamiast `only`, bo `only`/`except`
# jest w GitLabie przestarzałe i miesza się z `rules` w innych jobach.
.babelhub:on-merge-request:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: always

# Kontrola lokalna: czyta kod, nie serwis, więc **nie potrzebuje tokenu** i nie zależy od
# dostępności BabelHub. Dlatego stoi pierwsza — najtańsza porażka to porażka bez żadnego żądania.
"babelhub:hardcoded-strings":
  extends:
    - .babelhub
    - .babelhub:on-merge-request
  stage: test
  script:
    - babelhub validate --check=hardcoded-strings --fail-on=error --output=plain

# Klucz bez zatwierdzonego tłumaczenia jedzie do aplikacji jako surowy klucz — to błąd, więc blokuje.
"babelhub:coverage":
  extends:
    - .babelhub
    - .babelhub:on-merge-request
  stage: test
  script:
    # Strażnik przed CLI: brak zmiennej to najczęstsza przyczyna czerwonego joba, a komunikat
    # samego CLI („nie wiem, dokąd się połączyć”) nie mówi, gdzie jej szukać. Kod `2` to błąd
    # konfiguracji — zgodnie z kontraktem kodów wyjścia CLI.
    - 'test -n "${BABELHUB_API_URL:-}" && test -n "${BABELHUB_TOKEN:-}" || { echo "Brak BABELHUB_API_URL i/lub BABELHUB_TOKEN — ustaw je w Settings → CI/CD → Variables (maskowany, nie protected)."; exit 2; }'
    - babelhub status --output=plain
    - babelhub push --dry-run --output=json
    - babelhub validate --check=coverage --fail-on=error --output=plain

# Placeholdery, HTML, ICU, duplikaty, puste teksty.
"babelhub:quality":
  extends:
    - .babelhub
    - .babelhub:on-merge-request
  stage: test
  script:
    - 'test -n "${BABELHUB_API_URL:-}" && test -n "${BABELHUB_TOKEN:-}" || { echo "Brak BABELHUB_API_URL i/lub BABELHUB_TOKEN — ustaw je w Settings → CI/CD → Variables (maskowany, nie protected)."; exit 2; }'
    - babelhub validate --check=quality --fail-on=error --output=plain

# Kontrola ma wagę ostrzeżenia, więc przy `--fail-on=error` **raportuje, ale nie blokuje**:
# niezatwierdzona wartość to zwykle praca w toku, a nie defekt. Chcesz twardej bramki („na main
# nie wchodzi nic niezatwierdzonego”)? Zmień próg na `--fail-on=warning` — świadomie, bo wtedy
# blokują też ostrzeżenia z `quality`.
"babelhub:acceptance":
  extends:
    - .babelhub
    - .babelhub:on-merge-request
  stage: test
  script:
    - 'test -n "${BABELHUB_API_URL:-}" && test -n "${BABELHUB_TOKEN:-}" || { echo "Brak BABELHUB_API_URL i/lub BABELHUB_TOKEN — ustaw je w Settings → CI/CD → Variables (maskowany, nie protected)."; exit 2; }'
    - babelhub validate --check=acceptance --fail-on=error --output=plain

# Synchronizacja po scaleniu do gałęzi głównej.
"babelhub:sync":
  extends: .babelhub
  stage: i18n
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always
  script:
    # Trzy zmienne, bo commit zwrotny potrzebuje jeszcze tokenu repozytorium.
    - 'test -n "${BABELHUB_API_URL:-}" && test -n "${BABELHUB_TOKEN:-}" && test -n "${I18N_BOT_TOKEN:-}" || { echo "Brak BABELHUB_API_URL, BABELHUB_TOKEN lub I18N_BOT_TOKEN — ustaw je w Settings → CI/CD → Variables."; exit 2; }'
    - babelhub sync --output=json
    # Commit zwrotny tylko wtedy, gdy są zmiany — inaczej każdy przebieg zostawiałby pusty commit.
    - |
      if git diff --quiet -- translations/ .babelhub.lock.json; then
        echo "Bez zmian — nic nie commituję."
        exit 0
      fi
    - git config user.name "babelhub-bot"
    - git config user.email "babelhub-bot@users.noreply.gitlab.example"
    - git add translations/ .babelhub.lock.json
    # **Cudzysłów wokół całej linii jest obowiązkowy.** Bez niego YAML widzi w `- git commit
    # -m "…: …"` **mapę** (dwukropek ze spacją rozdziela klucz i wartość), więc `script` dostaje
    # obiekt zamiast polecenia i platforma odrzuca konfigurację.
    - 'git commit -m "chore(i18n): synchronizacja tłumaczeń z BabelHub"'
    # ZMIEŃ 3/3: `I18N_BOT_TOKEN` to **maskowana** zmienna projektu (Project → Settings → CI/CD
    # → Variables) z tokenem dostępu o zakresie `write_repository`. Token joba GitLaba
    # (`CI_JOB_TOKEN`) tu nie działa: nie ma prawa wypychać commitów.
    - git push "https://oauth2:${I18N_BOT_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "HEAD:${CI_COMMIT_REF_NAME}"
