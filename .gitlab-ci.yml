# CI repozytorium CLI: skanery bezpieczeństwa GitLaba + bramka jakości i binarka wydania.
#
# Plik powstał z **dwóch źródeł i żadne nie zostało usunięte**:
#   * `sast` i `secret_detection` (razem z `include:` szablonów) włączył GitLab przy zakładaniu
#     repozytorium — zostają, bo skanują kod i historię pod kątem sekretów i typowych błędów;
#   * `verify:php83`, `verify:php85`, `package` i `release` to bramka tego repozytorium:
#     zachowanie i typy (PHPUnit, PHPStan, PHPCS), binarka PHAR oraz wydanie z tagiem.
#
# **Dlaczego GitLab, a nie GitHub Actions:** repozytorium stoi na `gitlab.com/babelhub/cli`, więc
# plik w `.github/workflows/` nie uruchomiłby się ani razu — a workflow, który nie chodzi, jest
# gorszy niż jego brak: wygląda jak kontrola i nikt nie zauważy, że jej nie ma. Fragmenty dla
# **klientów** (oba światy) to coś innego i zostają tam, gdzie ich miejsce: `examples/ci/`
# + `docs/ci.md`.
#
# **Dwie wersje PHP, nie jedna.** `composer:2` wozi dziś PHP 8.5, a `composer.json` deklaruje
# `php: ^8.3` — więc bramka chodzi i na deklarowanym dole (`php:8.3-cli`), i na tym, co wozi obraz
# Composera. To nie ostrożnościowy ozdobnik: różnica 8.3/8.5 **już raz przewróciła bramkę** —
# PHPStan uruchomiony na 8.5 nie zwęża `array_shift()` do `string`, więc `LocaleFile` przechodził
# na 8.3, a padał na 8.5 (guard jest teraz jawny, ale następna taka różnica ma się ujawnić tutaj,
# a nie u kontrybutora).
#
# Jedna rzecz techniczna, o którą łatwo się potknąć: `image:` stoi w **jobach**, a nie
# w `default:` — inaczej nadpisałoby obrazy analizatorów z dołączonych szablonów bezpieczeństwa.

stages:
  - test
  - secret-detection
  - package
  - release

# --- skanery bezpieczeństwa (z szablonów GitLaba) --------------------------------------------
sast:
  stage: test

secret_detection:
  stage: secret-detection

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

variables:
  SECRET_DETECTION_ENABLED: 'true'

# --- bramka tego repozytorium ----------------------------------------------------------------
.verify:
  stage: test
  variables:
    # Obrazy pracują jako root; bez tego Composer ostrzega przy każdym poleceniu.
    COMPOSER_ALLOW_SUPERUSER: "1"
    # **Pełna historia i tagi, nie płytki klon.** `VersionTest` porównuje stałą wersji z tagiem
    # na HEAD; bez tagów test pomija się — i „zielono” znaczy „nie sprawdzono”. Ta sama pułapka
    # co przy każdym strażniku, który nie odróżnia „zgadza się” od „nie ma czego sprawdzić”.
    GIT_DEPTH: "0"
  cache:
    # Klucz z `composer.lock`: dopisanie zależności unieważnia cache samo, bez ręcznego numerka.
    key:
      files:
        - composer.lock
    paths:
      - vendor/
  script:
    - composer install --no-interaction --prefer-dist
    - composer check

# Deklarowany dół wsparcia. `php:8.3-cli` nie ma `git` ani `unzip`, a bez jednego z nich Composer
# nie rozpakuje paczek (`ext-zip` też nie ma), więc obraz dostaje je w `before_script`.
verify:php83:
  extends: .verify
  image: php:8.3-cli
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git unzip > /dev/null
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer

# To, co realnie wozi obraz Composera (dziś PHP 8.5) — czyli wersja, na której bramkę uruchomi
# większość kontrybutorów.
verify:php85:
  extends: .verify
  image: composer:2

package:
  stage: package
  image: composer:2
  variables:
    COMPOSER_ALLOW_SUPERUSER: "1"
  cache:
    key:
      files:
        - composer.lock
    paths:
      - vendor/
  script:
    - composer install --no-interaction --prefer-dist
    - php -d phar.readonly=0 build-phar.php babelhub.phar
    # Uruchomienie **z katalogu poza repozytorium**: gdyby stub szukał `vendor/autoload.php`
    # projektu, wyszłoby to dopiero u użytkownika po pobraniu binarki.
    - cd /tmp && php "$CI_PROJECT_DIR/babelhub.phar" --version && php "$CI_PROJECT_DIR/babelhub.phar" list --format=json > /dev/null
  artifacts:
    # Binarka jest artefaktem **każdego** zielonego pipeline'u (do pobrania z joba), a nie tylko
    # wydania — dzięki temu da się nią sprawdzić poprawkę przed tagiem.
    paths:
      - babelhub.phar
    expire_in: 1 month

release:
  stage: release
  # `release:` wymaga `release-cli`, którego obraz Composera nie ma — stąd osobny obraz.
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs: ["package"]
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - echo "Wydanie $CI_COMMIT_TAG — binarka z joba package."
  release:
    tag_name: $CI_COMMIT_TAG
    name: "BabelHub CLI $CI_COMMIT_TAG"
    description: "Binarka PHAR w załączniku. Po publikacji pakietu: `composer global require babelhub/cli:$CI_COMMIT_TAG`."
    assets:
      links:
        - name: babelhub.phar
          url: "$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/raw/babelhub.phar?job=package"
